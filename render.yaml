services:
  - type: web
    name: jurix-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEON_DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: IK_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
